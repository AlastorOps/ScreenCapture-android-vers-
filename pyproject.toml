[project]
name = "androidlink"
version = "0.1.0"
description = "Android-to-Windows USB companion and control center"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "av>=13.0",
    "numpy>=1.26",
    "pyvirtualcam>=0.15",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
androidlink = "androidlink.app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["androidlink*"]
